<script>
/* ── Language toggle (EN ⇄ 中文) ──
   Every English page X.html has a Chinese twin X-zh.html, except the
   research pages, whose Chinese version is the default (gen1.html) and
   the English one carries the -en suffix (gen1-en.html).
   On a Chinese page this script also localises the shared navbar and
   repoints its links to the Chinese twins. */
(function () {
  var RESEARCH = { "gen1": 1, "gen2": 1, "gen3": 1, "research-overview": 1 };
  var NAV_ZH = {
    "Home": "首頁",
    "About": "關於我",
    "BS of AM": "應數學士",
    "MS of DSIC": "資科碩士",
    "MS of SDAR": "SDAR 碩士",
    "Overview": "總覽",
    "Quantum Bayesian Inference": "量子貝氏推論",
    "ML & Data Science": "機器學習與資料科學",
    "Deep Learning": "深度學習",
    "Big Data Analysis": "巨量資料分析",
    "Data Analysis Math": "資料分析數學",
    "GIS & Python": "GIS 與 Python",
    "Data Visualization": "資料視覺化",
    "Information Management": "資訊管理",
    "OutfitDB (final project)": "OutfitDB（期末專案）",
    "CV": "履歷"
  };

  function split(file) {
    var m = /^(.*?)\.html$/.exec(file || "index.html");
    var base = m ? m[1] : "index";
    if (base === "") base = "index";
    if (RESEARCH[base]) return { base: base, zh: true, research: true };
    if (/-en$/.test(base) && RESEARCH[base.slice(0, -3)])
      return { base: base.slice(0, -3), zh: false, research: true };
    if (/-zh$/.test(base)) return { base: base.slice(0, -3), zh: true, research: false };
    return { base: base, zh: false, research: false };
  }
  function toZh(file) {
    var p = split(file);
    if (p.zh) return file;
    return p.research ? p.base + ".html" : p.base + "-zh.html";
  }
  function toEn(file) {
    var p = split(file);
    if (!p.zh) return file;
    return p.research ? p.base + "-en.html" : p.base + ".html";
  }

  var here = split(location.pathname.split("/").pop());
  var toggle = document.querySelector('.navbar a.nav-link[href$="index-zh.html"]');
  if (toggle) {
    var file = here.base + (here.zh ? (here.research ? "" : "-zh") : (here.research ? "-en" : "")) + ".html";
    toggle.href = here.zh ? toEn(file) : toZh(file);
    toggle.textContent = here.zh ? "EN" : "中文";
    toggle.setAttribute("lang", here.zh ? "en" : "zh-TW");
    toggle.title = here.zh ? "Switch to English" : "切換至中文";
  }

  if (!here.zh) return;
  document.querySelectorAll(".navbar a.nav-link, .navbar a.dropdown-item").forEach(function (a) {
    if (a === toggle) return;
    var txt = a.textContent.trim();
    if (NAV_ZH[txt]) {
      var span = a.querySelector(".menu-text");
      (span || a).textContent = NAV_ZH[txt];
    }
    var href = a.getAttribute("href") || "";
    var m = /^(\.\/)?([A-Za-z0-9_-]+\.html)(#.*)?$/.exec(href);
    if (m) a.setAttribute("href", toZh(m[2]) + (m[3] || ""));
  });
})();
</script>
