name: Mirror main to chentzuyuan.github.io

# chentzuyuan.github.io is served from a separate repository
# (chentzuyuan/chentzuyuan.github.io, main branch, /docs folder). Keep it
# identical to this repository's main so both sites always show the same
# content. Requires the MIRROR_TOKEN secret: a fine-grained PAT from the
# chentzuyuan account with Contents: read/write on that one repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Don't leave the Actions token in git config; it would override
          # the MIRROR_TOKEN in the push URL below.
          persist-credentials: false

      - name: Push main to the mirror
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "MIRROR_TOKEN secret is not set; skipping mirror push."
            exit 0
          fi
          # The mirror must not receive this workflow: it has no MIRROR_TOKEN,
          # and a fine-grained PAT without the "workflows" permission is not
          # allowed to push workflow files anyway. Strip .github/workflows in
          # a throwaway commit on top of main and push that.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -q --cached .github/workflows
          git commit -q -m "Mirror of buttegggggggg/buttegggggggg.github.io@${GITHUB_SHA::7} (workflows stripped)"
          git push --force \
            "https://x-access-token:${MIRROR_TOKEN}@github.com/chentzuyuan/chentzuyuan.github.io.git" \
            HEAD:main
